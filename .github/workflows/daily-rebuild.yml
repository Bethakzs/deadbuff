# Rebuilds the site every 6 hours so the prerendered pages (win rates, top builds, counters) and the
# API snapshots in dist/data/ (what the app shows with the default filters, without calling the
# Function proxy) stay fresh. Cloudflare Pages runs the actual build — this only pings its deploy hook.
# 4 builds a day ≈ 120 a month of the Free plan's 500.
#
# Setup: Cloudflare dashboard → Workers & Pages → <project> → Settings → Builds →
#        Deploy hooks → create one for the production branch, then add its URL to
#        GitHub → repo → Settings → Secrets and variables → Actions → CF_PAGES_DEPLOY_HOOK
name: Daily rebuild

on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::CF_PAGES_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
